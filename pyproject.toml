[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "task-scheduler-mcp"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "psycopg[binary]",
    "alembic",
    "pydantic>=2",
    "pydantic-settings",
    "mcp",
    "boto3",
    "httpx",
    "croniter>=6.2.2",
    "icalendar>=6.0",
    "aiosmtplib>=3.0",
    "email-validator>=2.0",
    "python-json-logger>=3.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "aiosmtpd>=1.4",
    "moto[s3]",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require running Compose services)",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
