<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Owl Task Scheduler MCP">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3A2818"/>
      <stop offset="1" stop-color="#1F1408"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#tile)"/>
  <!-- moon -->
  <circle cx="49" cy="15" r="6.5" fill="#F0E1BE" opacity="0.92"/>
  <circle cx="46" cy="13" r="6.5" fill="#332316"/>

  <!-- perch -->
  <rect x="13" y="50" width="38" height="5" rx="2.5" fill="#C77B2C"/>
  <!-- feet -->
  <g stroke="#D88A35" stroke-width="2.4" stroke-linecap="round" fill="none">
    <path d="M27 44 L27 50"/><path d="M24 50 q-1 3 3 3"/><path d="M30 50 q1 3 -3 3"/>
    <path d="M37 44 L37 50"/><path d="M34 50 q-1 3 3 3"/><path d="M40 50 q1 3 -3 3"/>
  </g>

  <!-- body -->
  <ellipse cx="31" cy="34" rx="14" ry="16" fill="#7A5236"/>
  <ellipse cx="35" cy="38" rx="9" ry="12" fill="#E6CE9C"/>
  <!-- wing -->
  <path d="M27 22 C16 26 13 40 18 52 C21 54 26 53 27 48 C29 40 30 28 27 22 Z" fill="#4A3122"/>

  <!-- head -->
  <circle cx="32" cy="21" r="13" fill="#85593A"/>
  <!-- tufts -->
  <path d="M24 11 L19 1 L31 9 Z" fill="#43301F"/>
  <path d="M40 9 L47 0 L35 11 Z" fill="#43301F"/>
  <!-- facial disk -->
  <path d="M31 9 C40 8 47 14 47 22 C47 31 40 35 34 34 C27 33 25 25 26 18 C27 12 26 10 31 9 Z" fill="#EAD6AC"/>
  <!-- brow -->
  <path d="M31 15 C37 12 44 14 46 19" stroke="#4A3122" stroke-width="2" stroke-linecap="round" fill="none"/>
  <!-- eye -->
  <circle cx="39" cy="22" r="6" fill="#F4E9CD"/>
  <circle cx="39" cy="22" r="4.2" fill="#C77B2C"/>
  <circle cx="39" cy="22" r="2.4" fill="#241509"/>
  <circle cx="40.2" cy="20.8" r="1" fill="#FFF7E6"/>
  <!-- beak -->
  <path d="M45 24 L52 27 L46 32 C42 31 42 26 45 24 Z" fill="#C77B2C"/>
</svg>
