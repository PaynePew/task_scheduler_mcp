name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - run: uv sync
      - run: uv run pytest -m "not integration"

  integration:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql+asyncpg://app:app@localhost:5432/app
      ALEMBIC_DATABASE_URL: postgresql+psycopg://app:app@localhost:5432/app
      QUEUE_URL: http://localhost:9324/queue/task-queue
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          python-version: "3.12"
      - name: Start Compose services
        run: docker compose up -d postgres elasticmq
      - name: Wait for services to be healthy
        run: |
          healthy=0
          for i in $(seq 1 30); do
            if docker compose ps --format json | python3 -c "
          import json, sys
          services = [json.loads(l) for l in sys.stdin if l.strip()]
          unhealthy = [s['Name'] for s in services if s.get('Health') not in ('healthy', '')]
          if unhealthy:
              print('Not yet healthy:', unhealthy); sys.exit(1)
          "; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            echo "::error::Services failed to become healthy within 60s"
            docker compose ps
            docker compose logs
            exit 1
          fi
      - run: uv sync
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Run integration tests
        run: uv run pytest -m integration
