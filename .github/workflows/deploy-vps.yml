name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialise deploys: never run two at once, but don't cancel an in-flight one
# (a cancel mid-migrate would leave the VPS in a half-migrated state).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/paynepew/task_scheduler_mcp:latest
            ghcr.io/paynepew/task_scheduler_mcp:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # docker compose recreates mcp-server when IMAGE_TAG changes, producing a
      # 10-30s window where Caddy returns 502. Better Stack polls every 3 min;
      # the gap occasionally crosses two consecutive polls and fires a false
      # alert. Free tier has no count-based threshold, so we pause the monitor
      # around the deploy. Resume below uses `if: always()` so a failed deploy
      # cannot leave the monitor silently muted. See issue #77 + ADR-031.
      - name: Pause Better Stack monitor
        env:
          BS_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          MONITOR_ID: ${{ vars.BETTERSTACK_MONITOR_ID }}
        run: |
          curl -fsS -X PATCH "https://uptime.betterstack.com/api/v2/monitors/$MONITOR_ID" \
            -H "Authorization: Bearer $BS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"paused": true}' > /dev/null
          echo "Better Stack monitor $MONITOR_ID paused"

      # Sync runtime files from source clone, pull new image, run migrations,
      # recreate the app stack. Rollback (persist the tag too, so a later reboot
      # doesn't revert): echo "IMAGE_TAG=<prev_sha>" > /opt/task_scheduler_mcp/.env
      # && docker compose up -d --force-recreate --no-deps mcp-server watcher
      # worker recurring-watcher chain-watcher on the VPS in /opt/task_scheduler_mcp.
      # --force-recreate is scoped to the app services: it prevents silent
      # stale-container bugs (issue #204) where docker compose up -d skips a
      # service whose image-id comparison is stale, leaving the old container
      # running under the new tag. Supporting services (postgres / elasticmq /
      # vector) are converged separately without --force-recreate. Ingress is no
      # longer in this project — the platform edge Caddy owns :80/:443 (ADR-0014
      # Phase 2 Stage C).
      - uses: appleboy/ssh-action@v1
        with:
          host: scheduler.paynepew.dev
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # `set -euo pipefail` aborts on the first failed command. Without
          # this, a failed `migrate` would still let `up -d` run (starting
          # the new image against an unmigrated DB → crashloop), and the
          # workflow would report success based on `up -d`'s exit code
          # alone. The legacy `script_stop: true` input was removed in
          # appleboy/ssh-action v1 — the shell-side directive is the
          # documented replacement
          # (https://github.com/appleboy/ssh-action#error-handling).
          script: |
            #!/usr/bin/env bash
            set -euo pipefail

            # Pull latest source into the source clone (never touched by runtime).
            cd /opt/task_scheduler_mcp_src
            git fetch origin
            git reset --hard origin/main

            # Sync the runtime config files from the source clone into the runtime
            # dir. CI is the only writer; manual edits are intentionally overwritten.
            # Phase 2 Stage C dropped `cp Caddyfile` + the static rsync: the
            # in-project Caddy is gone, the platform edge Caddy owns ingress, and
            # mcp-server serves the landing page from the app image (app/web/static).
            cp infra/vps/docker-compose.yml /opt/task_scheduler_mcp/
            cp infra/vps/vector.toml /opt/task_scheduler_mcp/
            cp elasticmq.conf /opt/task_scheduler_mcp/

            # Deploy from the runtime dir (now holds the 3 entries above + .env.docker).
            cd /opt/task_scheduler_mcp

            # Persist the deployed SHA to the compose substitution env file (.env,
            # which docker compose auto-reads for ${IMAGE_TAG}). Without this,
            # IMAGE_TAG lived only in this CD shell, so any recreate OUTSIDE this
            # deploy — a box reboot's systemd `up -d`, or a manual `up -d` such as a
            # cutover rollback — fell back to ${IMAGE_TAG:-latest} → the box's stale
            # local :latest, whose Alembic lacked the DB's current revision → migrate
            # failed → full outage (incident 2026-06-05). Pinning the immutable SHA
            # here makes every recreate deterministic. NOTE: .env (substitution), NOT
            # .env.docker (container env) — compose reads them for different purposes.
            echo "IMAGE_TAG=${{ github.sha }}" > .env

            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm migrate

            # Converge the supporting services (postgres / elasticmq / vector)
            # WITHOUT --force-recreate. --remove-orphans also reaps any container
            # no longer in the compose file — e.g. the in-project caddy removed in
            # Stage C (its image/config are unchanged so nothing else is rebuilt).
            docker compose up -d --remove-orphans

            # Force-recreate ONLY the app services. --no-deps stops compose from
            # re-running migrate (already done above) and keeps the issue #204
            # stale-container protection for the app containers.
            docker compose up -d --force-recreate --no-deps \
              mcp-server watcher worker recurring-watcher chain-watcher

            # Log the GIT_SHA each app container actually sees so any
            # env-var override (e.g. stale GIT_SHA in .env.docker) is
            # visible in the GitHub Actions deploy log (issue #204).
            echo "=== post-deploy GIT_SHA per service ==="
            for svc in mcp-server watcher worker recurring-watcher chain-watcher; do
              sha=$(docker compose exec -T "$svc" sh -c 'echo $GIT_SHA' 2>/dev/null || echo "exec-failed")
              echo "  $svc: $sha"
            done

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            body=$(curl -fsS --max-time 10 https://scheduler.paynepew.dev/healthz) && {
              echo "$body"
              version=$(echo "$body" | python3 -c "import sys,json; print(json.load(sys.stdin).get('version',''))")
              if [ "$version" = "unknown" ] || [ -z "$version" ]; then
                echo "Smoke test failed: version field is '$version' (expected SHA)"
                exit 1
              fi
              # Verify /healthz advertises the SHA we just deployed (issue #204).
              # A mismatch means an old container is still serving traffic.
              if [ "$version" != "${{ github.sha }}" ]; then
                echo "Smoke test failed: /healthz version '$version' != deployed SHA '${{ github.sha }}'"
                exit 1
              fi
              echo "Smoke test passed on attempt $i (version=$version)"
              exit 0
            }
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 5 attempts"
          exit 1

      # if: always() — runs even when an earlier step failed, so a broken
      # deploy cannot leave the monitor paused indefinitely (which would
      # silently suppress real downtime alerts).
      - name: Resume Better Stack monitor
        if: always()
        env:
          BS_TOKEN: ${{ secrets.BETTERSTACK_API_TOKEN }}
          MONITOR_ID: ${{ vars.BETTERSTACK_MONITOR_ID }}
        run: |
          curl -fsS -X PATCH "https://uptime.betterstack.com/api/v2/monitors/$MONITOR_ID" \
            -H "Authorization: Bearer $BS_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"paused": false}' > /dev/null
          echo "Better Stack monitor $MONITOR_ID resumed"
