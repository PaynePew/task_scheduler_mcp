name: Deploy to VPS

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

# Serialise deploys: never run two at once, but don't cancel an in-flight one
# (a cancel mid-migrate would leave the VPS in a half-migrated state).
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/paynepew/chatgpt_task:latest
            ghcr.io/paynepew/chatgpt_task:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Pull new image, run migrations, recreate stack.
      # Rollback: IMAGE_TAG=<prev_sha> docker compose up -d on the VPS.
      - uses: appleboy/ssh-action@v1
        with:
          host: scheduler.paynepew.dev
          username: deploy
          key: ${{ secrets.VPS_SSH_KEY }}
          # `set -euo pipefail` aborts on the first failed command. Without
          # this, a failed `migrate` would still let `up -d` run (starting
          # the new image against an unmigrated DB → crashloop), and the
          # workflow would report success based on `up -d`'s exit code
          # alone. The legacy `script_stop: true` input was removed in
          # appleboy/ssh-action v1 — the shell-side directive is the
          # documented replacement
          # (https://github.com/appleboy/ssh-action#error-handling).
          script: |
            #!/usr/bin/env bash
            set -euo pipefail
            cd /opt/chatgpt_task
            export IMAGE_TAG=${{ github.sha }}
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d --remove-orphans

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS --max-time 10 https://scheduler.paynepew.dev/healthz; then
              echo ""
              echo "Smoke test passed on attempt $i"
              exit 0
            fi
            echo "Attempt $i failed, retrying in 5s..."
            sleep 5
          done
          echo "Smoke test failed after 5 attempts"
          exit 1
