# Compose project name pinned to keep Docker volume namespace stable across the
# ADR-044 chatgpt_task → task_scheduler_mcp rename. Without this, renaming
# /opt/chatgpt_task → /opt/task_scheduler_mcp would change the default project
# name (derived from the directory basename) and orphan the existing
# chatgpt_task_pgdata / chatgpt_task_caddy_data volumes. See ADR-044 §4.1.
name: chatgpt_task

services:
  mcp-server:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.mcp_http"]
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # python:slim base image has no curl; use urllib instead.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz').read()"]
      interval: 30s
      timeout: 5s
      retries: 3

  watcher:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.watcher"]
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.worker"]
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  recurring-watcher:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.recurring_watcher"]
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  chain-watcher:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.chain_watcher"]
    env_file: .env.docker
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully

  migrate:
    image: ghcr.io/paynepew/task_scheduler_mcp:${IMAGE_TAG:-latest}
    command: ["python", "-m", "app.entrypoints.migrate"]
    env_file: .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16
    env_file: .env.docker
    restart: unless-stopped
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-scheduler}"]
      interval: 5s
      timeout: 5s
      retries: 10

  elasticmq:
    image: softwaremill/elasticmq-native:latest
    restart: unless-stopped
    volumes:
      - ./elasticmq.conf:/opt/elasticmq.conf:ro
    healthcheck:
      test: ["CMD-SHELL", "nc -z localhost 9324 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./static:/var/www:ro
      - caddy_data:/data
    # No depends_on: mcp-server — intentionally. Caddy dials its static upstream
    # (mcp-server:8000) per request and tolerates a down backend (502/503; the
    # /mcp* block has active health checks), so it does not need mcp-server at
    # startup. The edge only ever bought start-ordering, and it cost us this:
    # docker compose propagates --recreate to dependents, so every app deploy
    # that recreated mcp-server also bounced the shared caddy (:80/:443) — even
    # after scoping --force-recreate to the app services (deploy-vps.yml).
    # Dropping the edge keeps the shared ingress up across app deploys.
    # See ADR-0014 Phase 0 / platform-team request.

  vector:
    image: timberio/vector:0.40.0-alpine
    restart: unless-stopped
    env_file: .env.docker
    # Explicit --config flag: timberio/vector image ships with a default
    # /etc/vector/*.yaml that auto-loads demo_logs + console sink. Without
    # this, both configs merge and you get fake demo data flooding stdout.
    command: ["--config", "/etc/vector/vector.toml"]
    volumes:
      - ./vector.toml:/etc/vector/vector.toml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector_data:/var/lib/vector

volumes:
  pgdata:
  caddy_data:
  vector_data:
